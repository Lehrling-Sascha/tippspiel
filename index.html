2omLMCedOaBsD8FQJoZrgo91CsBhmtfN62AxKblvZqA/WnzLY0IGmNjWzr0EBbDIshZb9HE+M=", "iter": 600000};

        (async function() {
            const hash = window.location.hash;

            if (!hash.startsWith('#password=')) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                return;
            }

            const pwd = decodeURIComponent(hash.substring('#password='.length));

            try {
                const salt = Uint8Array.from(atob(PAYLOAD.salt), c => c.charCodeAt(0));
                const iv = Uint8Array.from(atob(PAYLOAD.iv), c => c.charCodeAt(0));
                const ct = Uint8Array.from(atob(PAYLOAD.ct), c => c.charCodeAt(0));

                const keyMaterial = await crypto.subtle.importKey(
                    'raw',
                    new TextEncoder().encode(pwd),
                    'PBKDF2',
                    false,
                    ['deriveKey']
                );

                const key = await crypto.subtle.deriveKey(
                    {
                        name: 'PBKDF2',
                        salt: salt,
                        iterations: PAYLOAD.iter,
                        hash: 'SHA-256'
                    },
                    keyMaterial,
                    { name: 'AES-GCM', length: 256 },
                    false,
                    ['decrypt']
                );

                const decrypted = await crypto.subtle.decrypt(
                    { name: 'AES-GCM', iv: iv },
                    key,
                    ct
                );

                const html = new TextDecoder().decode(decrypted);
                document.open();
                document.write(html);
                document.close();

            } catch(e) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
            }
        })();
    </script>
