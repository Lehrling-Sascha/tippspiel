                    false,
                    ['deriveKey']

                    false,

                    ct
                );

                const html = new TextDecoder().decode(decrypted);
                document.open();
                document.write(html);
                document.close();

            } catch(e) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
            }
        })();
    </script>
</body>
</html>
