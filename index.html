    <title>🔒 Tippspiel — Passwort erforderlich</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-box {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        .login-box h1 { font-size: 2em; margin-bottom: 10px; }
        .login-box p { color: #888; margin-bottom: 25px; }
        input[type="password"] {
            width: 100%;
            padding: 14px 18px;
            font-size: 1.1em;
            border: 2px solid #444;
            border-radius: 8px;
            background: rgba(255,255,255,0.08);
            color: white;
            margin-bottom: 15px;
            outline: none;
        }
        input[type="password"]:focus { border-color: #f9d423; }
        button {
            width: 100%;
            padding: 14px;
            font-size: 1.1em;
            border: none;
            border-radius: 8px;
            background: linear-gradient(90deg, #f9d423, #ff4e50);
            color: #1a1a2e;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { opacity: 0.9; }
        .error {
            color: #ef5350;
            margin-top: 15px;
            display: none;
        }
        .remember {
            margin: 10px 0 20px;
            color: #888;
            font-size: 0.9em;
        }
        .remember input { margin-right: 6px; }
        .loading {
            display: none;
            color: #f9d423;
            margin-top: 15px;
        }
    </style>
</head>

        const STORAGE_KEY = 'tippspiel_auth';

        // === Methode 1: Auto-Unlock per URL-Hash ===
        // URL: https://.../#password=MeinPasswort
        (async function() {
            const hash = window.location.hash;
            if (hash.startsWith('#password=')) {
                const pwd = decodeURIComponent(hash.substring('#password='.length));
                showLoading();
                try {
                    await doDecrypt(pwd);
                    return;
                } catch(e) {
                    hideLoading();
                }
            }

            // === Methode 2: Gespeichertes Passwort (localStorage) ===
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    if (data.expires > Date.now()) {
                        showLoading();
                        await doDecrypt(data.password);
                        return;
                    } else {
                        localStorage.removeItem(STORAGE_KEY);
                    }
                } catch(e) {
                    hideLoading();
                }
            }
        })();

        function showLoading() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('pwd').style.display = 'none';
            document.querySelector('button').style.display = 'none';
            document.querySelector('.remember').style.display = 'none';
        }

        function hideLoading() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('pwd').style.display = 'block';
            document.querySelector('button').style.display = 'block';
            document.querySelector('.remember').style.display = 'block';
        }

        async function decrypt() {
            const pwd = document.getElementById('pwd').value;
            if (!pwd) return;
            showLoading();
            try {
                await doDecrypt(pwd);
                if (document.getElementById('remember').checked) {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify({
                        password: pwd,
                        expires: Date.now() + 30*24*60*60*1000
                    }));
                }
            } catch(e) {
                hideLoading();
                document.getElementById('error').style.display = 'block';
                document.getElementById('pwd').value = '';
                document.getElementById('pwd').focus();
            }
        }

        async function doDecrypt(password) {
            const salt = Uint8Array.from(atob(PAYLOAD.salt), c => c.charCodeAt(0));
            const iv = Uint8Array.from(atob(PAYLOAD.iv), c => c.charCodeAt(0));
            const ct = Uint8Array.from(atob(PAYLOAD.ct), c => c.charCodeAt(0));

            const keyMaterial = await crypto.subtle.importKey(
                'raw',
                new TextEncoder().encode(password),
                'PBKDF2',
                false,
                ['deriveKey']
            );

            const key = await crypto.subtle.deriveKey(
                {
                    name: 'PBKDF2',
                    salt: salt,
                    iterations: PAYLOAD.iter,
                    hash: 'SHA-256'
                },
                keyMaterial,
                { name: 'AES-GCM', length: 256 },
                false,
                ['decrypt']
            );

            const decrypted = await crypto.subtle.decrypt(
                { name: 'AES-GCM', iv: iv },
                key,
                ct
            );

            const html = new TextDecoder().decode(decrypted);
            document.open();
            document.write(html);
            document.close();
        }
    </script>
