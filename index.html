                    false,
                    ['deriveKey']

                        name: 'PBKDF2',

                    { name: 'AES-GCM', length: 256 },
                    false,

                );

                const html = new TextDecoder().decode(decrypted);
                document.open();
                document.write(html);
                document.close();

            } catch(e) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
            }
        })();
    </script>
</body>
</html>
